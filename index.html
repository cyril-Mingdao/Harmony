<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台語合音 - 互動遊戲</title>
    <link href="https://tauhu.tw/tauhu-oo.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: tauhu-oo, sans-serif;
        }

        body {
            overflow: hidden;
            background: #000000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 900px;
            position: relative;
            background: #000000;
            box-shadow: 0 30px 80px rgba(218, 165, 32, 0.3);
            overflow: hidden;
            border: 3px solid #DAA520;
        }

        .slide {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
            background: #000000;
        }

        .slide.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 封面背景圖片 */
        .cover-image {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        .question-number {
            position: absolute;
            top: 30px;
            left: 30px;
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(135deg, #DAA520 0%, #FFD700 50%, #DAA520 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(218, 165, 32, 0.5);
            z-index: 10;
            padding: 12px 24px;
            border: 2px solid #DAA520;
            border-radius: 12px;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }

        .page-indicator {
            position: absolute;
            top: 30px;
            right: 30px;
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #DAA520 0%, #FFD700 50%, #DAA520 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            z-index: 10;
            padding: 12px 24px;
            border: 2px solid #DAA520;
            border-radius: 12px;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(218, 165, 32, 0.4);
        }

        .corner-image {
            position: absolute;
            bottom: 76.3px;
            left: 30px;
            width: 180px;
            height: auto;
            z-index: 5;
            filter: drop-shadow(0 0 15px rgba(218, 165, 32, 0.6));
            transition: transform 0.3s ease;
        }

        .corner-image:hover {
            transform: scale(1.05);
        }

        .shape {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-radius: 20px;
            transition: all 0.4s ease;
            padding: 20px;
            word-wrap: break-word;
            font-weight: bold;
            border: 3px solid #DAA520;
            background: rgba(0, 0, 0, 0.9);
            box-shadow: 0 0 30px rgba(218, 165, 32, 0.5), inset 0 0 20px rgba(218, 165, 32, 0.2);
        }

        .overlay {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.4s ease;
            padding: 20px;
            z-index: 3;
            font-weight: bold;
            border: 3px solid #FFD700;
            background: linear-gradient(135deg, rgba(218, 165, 32, 0.3) 0%, rgba(255, 215, 0, 0.3) 100%);
            backdrop-filter: blur(5px);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.6), inset 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .overlay:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.8), inset 0 0 40px rgba(255, 215, 0, 0.4);
            border-color: #FFD700;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
        }

        .shape.revealed {
            animation: goldShine 0.8s ease;
        }

        @keyframes goldShine {
            0% { 
                transform: translateY(50px) scale(0.9);
                opacity: 0;
                box-shadow: 0 0 0 rgba(218, 165, 32, 0);
            }
            50% {
                box-shadow: 0 0 60px rgba(255, 215, 0, 1);
            }
            100% { 
                transform: translateY(0) scale(1);
                opacity: 1;
                box-shadow: 0 0 30px rgba(218, 165, 32, 0.5);
            }
        }

        /* 鎏金風格色彩 */
        .gold-text {
            background: linear-gradient(135deg, #DAA520 0%, #FFD700 50%, #DAA520 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(218, 165, 32, 0.5);
        }

        .pink-box {
            background: rgba(139, 0, 0, 0.8) !important;
            border-color: #DAA520 !important;
            box-shadow: 0 0 30px rgba(218, 165, 32, 0.5), inset 0 0 20px rgba(218, 165, 32, 0.2) !important;
        }

        .pink-box .shape-text {
            background: linear-gradient(135deg, #DAA520 0%, #FFD700 50%, #DAA520 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .green-box {
            background: rgba(0, 50, 0, 0.8) !important;
            border-color: #32CD32 !important;
            box-shadow: 0 0 30px rgba(50, 205, 50, 0.5), inset 0 0 20px rgba(50, 205, 50, 0.2) !important;
        }

        .green-box .shape-text {
            background: linear-gradient(135deg, #32CD32 0%, #7FFF00 50%, #32CD32 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .yellow-overlay {
            background: linear-gradient(135deg, rgba(218, 165, 32, 0.4) 0%, rgba(255, 215, 0, 0.4) 100%) !important;
            border-color: #FFD700 !important;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.7), inset 0 0 30px rgba(255, 215, 0, 0.3) !important;
        }

        .yellow-overlay .shape-text {
            background: linear-gradient(135deg, #FFD700 0%, #FFF8DC 50%, #FFD700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.8));
        }

        .navigation {
            position: fixed;
            bottom: 30px;
            left: 48.9px;
            display: flex;
            gap: 15px;
            z-index: 1000;
        }

        .nav-btn {
            padding: 16px 40px;
            font-size: 20px;
            border: 3px solid #DAA520;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(218, 165, 32, 0.2) 0%, rgba(255, 215, 0, 0.2) 100%);
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: tauhu-oo, sans-serif;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(218, 165, 32, 0.4);
            background: linear-gradient(135deg, #DAA520 0%, #FFD700 50%, #DAA520 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            overflow: hidden;
        }

        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(218, 165, 32, 0.1) 0%, rgba(255, 215, 0, 0.1) 100%);
            z-index: -1;
        }

        .nav-btn:hover:not(:disabled) {
            transform: translateY(-4px);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.7);
            border-color: #FFD700;
        }

        .nav-btn:hover:not(:disabled)::before {
            background: linear-gradient(135deg, rgba(218, 165, 32, 0.3) 0%, rgba(255, 215, 0, 0.3) 100%);
        }

        .nav-btn:active:not(:disabled) {
            transform: translateY(-2px);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .game-container {
                max-width: 100%;
                max-height: 100%;
                border: 2px solid #DAA520;
            }

            .navigation {
                bottom: 15px;
                left: 33.9px;
                gap: 10px;
            }

            .nav-btn {
                padding: 12px 24px;
                font-size: 16px;
            }

            .page-indicator {
                font-size: 20px;
                top: 15px;
                right: 15px;
                padding: 8px 16px;
            }

            .shape, .overlay {
                font-size: 0.85em !important;
                padding: 12px;
                border-radius: 16px;
                border-width: 2px;
            }

            .question-number {
                font-size: 24px;
                top: 15px;
                left: 15px;
                padding: 8px 16px;
            }

            .corner-image {
                width: 120px;
                bottom: 127.8px;
                left: 15px;
            }
        }

        @media (max-width: 480px) {
            .nav-btn {
                padding: 10px 20px;
                font-size: 14px;
            }

            .page-indicator {
                font-size: 18px;
            }

            .question-number {
                font-size: 20px;
                padding: 6px 12px;
            }

            .corner-image {
                width: 100px;
            }

            .shape, .overlay {
                font-size: 0.75em !important;
                padding: 10px;
            }
        }

        /* 加載動畫 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .game-container {
            animation: fadeIn 0.6s ease;
        }

        /* 金色光暈效果 */
        @keyframes goldPulse {
            0%, 100% {
                box-shadow: 0 0 30px rgba(218, 165, 32, 0.4);
            }
            50% {
                box-shadow: 0 0 50px rgba(255, 215, 0, 0.8);
            }
        }

        .game-container {
            animation: fadeIn 0.6s ease, goldPulse 3s ease-in-out infinite;
        }
    </style>
</head>

        let currentSlide = 0;

        // 檢測螢幕方向
        function getOrientation() {
            return window.innerWidth > window.innerHeight ? 'landscape' : 'portrait';
        }

        // 創建所有投影片
        function createSlides() {
            const container = document.querySelector('.game-container');
            
            slidesData.forEach((slideData, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'slide';
                slideDiv.id = `slide-${index}`;
                
                // 第一張投影片(封面)
                if (index === 0) {
                    const coverImg = document.createElement('img');
                    coverImg.className = 'cover-image';
                    const orientation = getOrientation();
                    const coverSrc = orientation === 'landscape' ? IMAGES.cover1 : IMAGES.cover2;
                    coverImg.src = `data:image/jpeg;base64,${coverSrc}`;
                    slideDiv.appendChild(coverImg);
                    
                    // 響應螢幕方向變化
                    window.addEventListener('resize', () => {
                        const newOrientation = getOrientation();
                        const newCoverSrc = newOrientation === 'landscape' ? IMAGES.cover1 : IMAGES.cover2;
                        coverImg.src = `data:image/jpeg;base64,${newCoverSrc}`;
                    });
                } else {
                    // 添加題號
                    const questionNum = document.createElement('div');
                    questionNum.className = 'question-number';
                    const numSpan = document.createElement('span');
                    numSpan.className = 'gold-text';
                    numSpan.textContent = `第${index}題`;
                    questionNum.appendChild(numSpan);
                    slideDiv.appendChild(questionNum);
                    
                    // 添加頁碼進度
                    const pageIndicator = document.createElement('div');
                    pageIndicator.className = 'page-indicator';
                    const pageSpan = document.createElement('span');
                    pageSpan.className = 'gold-text';
                    pageSpan.textContent = `${index}/23`;
                    pageIndicator.appendChild(pageSpan);
                    slideDiv.appendChild(pageIndicator);
                    
                    // 添加左下角圖片(透明背景)
                    const cornerImg = document.createElement('img');
                    cornerImg.className = 'corner-image';
                    cornerImg.src = `data:image/png;base64,${IMAGES.pic2}`;
                    slideDiv.appendChild(cornerImg);
                    
                    // 創建形狀和覆蓋層
                    slideData.shapes.forEach((shape, shapeIndex) => {
                        if (shape.type === 'overlay') {
                            // 創建覆蓋層
                            const overlay = document.createElement('div');
                            overlay.className = `overlay ${shape.fill_color}`;
                            const textSpan = document.createElement('span');
                            textSpan.className = 'shape-text';
                            textSpan.textContent = shape.text;
                            overlay.appendChild(textSpan);
                            overlay.style.fontSize = `${shape.font_size || 48}px`;
                            overlay.style.left = `${shape.left}%`;
                            overlay.style.top = `${shape.top}%`;
                            overlay.style.width = `${shape.width}%`;
                            overlay.style.height = `${shape.height}%`;
                            overlay.dataset.target = shape.target;
                            
                            // 點擊覆蓋層顯示下方內容
                            overlay.addEventListener('click', function() {
                                this.classList.add('hidden');
                                const targetText = this.dataset.target;
                                const targetShape = slideDiv.querySelector(`.shape[data-text="${targetText}"]`);
                                if (targetShape) {
                                    targetShape.classList.add('revealed');
                                    targetShape.style.opacity = '1';
                                }
                            });
                            
                            slideDiv.appendChild(overlay);
                        } else if (shape.type === 'shape' && shape.text) {
                            const element = document.createElement('div');
                            element.className = `shape ${shape.fill_color}`;
                            const textSpan = document.createElement('span');
                            textSpan.className = 'shape-text';
                            const displayText = (shape.text === 'tsua̋n-ne') ? 'tsua̋n-ne\ntsua̋n' : shape.text;
                            textSpan.textContent = displayText;
                            textSpan.style.whiteSpace = 'pre-line';
                            element.appendChild(textSpan);
                            element.style.fontSize = `${shape.font_size || 48}px`;
                            element.style.left = `${shape.left}%`;
                            element.style.top = `${shape.top}%`;
                            element.style.width = `${shape.width}%`;
                            element.style.height = `${shape.height}%`;
                            element.dataset.text = shape.text;
                            
                            // 如果是隱藏的，設置初始不可見
                            if (shape.hidden) {
                                element.style.opacity = '0';
                            }
                            
                            slideDiv.appendChild(element);
                        }
                    });
                }
                
                container.appendChild(slideDiv);
            });
            
            // 顯示第一張投影片
            document.getElementById('slide-0').classList.add('active');
            updateNavigation();
        }

        // 切換投影片
        function showSlide(index) {
            document.querySelectorAll('.slide').forEach(slide => {
                slide.classList.remove('active');
            });
            
            const targetSlide = document.getElementById(`slide-${index}`);
            if (targetSlide) {
                targetSlide.classList.add('active');
                currentSlide = index;
                
                // 重置當前投影片的覆蓋層
                targetSlide.querySelectorAll('.overlay').forEach(overlay => {
                    overlay.classList.remove('hidden');
                });
                
                // 隱藏所有需要隱藏的形狀
                targetSlide.querySelectorAll('.shape[data-text]').forEach(shape => {
                    const shapeData = slidesData[index].shapes.find(s => s.text === shape.dataset.text);
                    if (shapeData && shapeData.hidden) {
                        shape.style.opacity = '0';
                        shape.classList.remove('revealed');
                    }
                });
                
                updateNavigation();
            }
        }

        // 上一張
        function previousSlide() {
            if (currentSlide > 0) {
                showSlide(currentSlide - 1);
            }
        }

        // 下一張
        function nextSlide() {
            if (currentSlide < slidesData.length - 1) {
                showSlide(currentSlide + 1);
            }
        }

        // 更新導航按鈕
        function updateNavigation() {
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').disabled = currentSlide === slidesData.length - 1;
        }

        // 鍵盤導航
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') previousSlide();
            if (e.key === 'ArrowRight') nextSlide();
        });

        // 初始化
        createSlides();
    </script>
